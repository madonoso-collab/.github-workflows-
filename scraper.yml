name: Run Daily Job Scraper

on:
  schedule:
    # Se programa a las 8:00 AM hora de Chile. 
    # El sistema nativo lo procesará de forma automatizada todas las mañanas.
    - cron: '0 8 * * *'
      timezone: 'America/Santiago'
  
  workflow_dispatch: # Mantenemos esto activo por si algún día quieres forzar la búsqueda manualmente

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install python-jobspy pandas

    - name: Run Scraper Script
      env:
        SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: python scraper.py
